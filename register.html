<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Register | Rofidin Ilyas</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.4"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;

      color: white;

      background:
        radial-gradient(circle at top right, #003b73, transparent 35%),
        radial-gradient(circle at bottom left, #001f3f, transparent 35%),
        #020817;
    }

    .register-box {
      width: 100%;
      max-width: 430px;

      padding: 35px 28px;

      border: 1px solid #00d9ff44;
      border-radius: 25px;

      background: rgba(5, 20, 40, 0.78);

      backdrop-filter: blur(15px);

      box-shadow: 0 0 45px #0077ff22;
    }

    .logo {
      text-align: center;

      font-size: 42px;
      font-weight: bold;

      color: #00d9ff;

      text-shadow:
        0 0 10px #00d9ff,
        0 0 25px #00d9ff;

      margin-bottom: 10px;
    }

    h1 {
      text-align: center;
      margin-bottom: 8px;
    }

    .subtitle {
      text-align: center;
      color: #91aac3;
      margin-bottom: 30px;
      line-height: 1.5;
    }

    label {
      display: block;

      margin-bottom: 8px;

      color: #bdefff;

      font-size: 14px;
    }

    input {
      width: 100%;

      padding: 14px;

      margin-bottom: 18px;

      border-radius: 12px;

      border: 1px solid #00d9ff44;

      outline: none;

      background: #061426;

      color: white;

      font-size: 15px;
    }

    input:focus {
      border-color: #00d9ff;

      box-shadow: 0 0 12px #00d9ff33;
    }

    button {
      width: 100%;

      padding: 14px;

      border: none;

      border-radius: 25px;

      background: #00bfff;

      color: #00101c;

      font-size: 16px;

      font-weight: bold;

      cursor: pointer;

      box-shadow: 0 0 20px #00bfff55;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .message {
      display: none;

      margin-top: 18px;

      padding: 13px;

      border-radius: 10px;

      text-align: center;

      font-size: 14px;

      line-height: 1.5;
    }

    .error {
      display: block;

      background: #ff003322;

      border: 1px solid #ff446655;

      color: #ff9b9b;
    }

    .success {
      display: block;

      background: #00ff9922;

      border: 1px solid #00ff9966;

      color: #8affc1;
    }

    .links {
      margin-top: 25px;

      text-align: center;

      line-height: 2;
    }

    .links a {
      color: #00d9ff;

      text-decoration: none;
    }

    .links a:hover {
      text-decoration: underline;
    }

    .back {
      display: block;

      margin-top: 15px;

      color: #71869d !important;
    }
  </style>
</head>

<body>

<div class="register-box">

  <div class="logo">
    RI
  </div>

  <h1>
    Buat Akun
  </h1>

  <p class="subtitle">
    Daftar untuk mengakses Portfolio Rofidin Ilyas
  </p>


  <form id="registerForm">

    <label for="fullName">
      Nama Lengkap
    </label>

    <input
      type="text"
      id="fullName"
      placeholder="Masukkan nama lengkap"
      required
    >


    <label for="email">
      Email
    </label>

    <input
      type="email"
      id="email"
      placeholder="Masukkan email"
      required
    >


    <label for="password">
      Password
    </label>

    <input
      type="password"
      id="password"
      placeholder="Minimal 8 karakter"
      minlength="8"
      required
    >


    <label for="confirmPassword">
      Konfirmasi Password
    </label>

    <input
      type="password"
      id="confirmPassword"
      placeholder="Masukkan ulang password"
      minlength="8"
      required
    >


    <button
      type="submit"
      id="registerButton"
    >
      Daftar
    </button>

  </form>


  <div
    id="message"
    class="message"
  ></div>


  <div class="links">

    Sudah punya akun?

    <a href="login.html">
      Login
    </a>

    <a
      href="index.html"
      class="back"
    >
      ← Kembali ke Portfolio
    </a>

  </div>

</div>


<script>

const SUPABASE_URL =
"https://vufpdlobkoeyjjxjhhzr.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
"sb_publishable_Za2pqw2-OpNY2ypVP036aw_Xzdk_nkq";


const supabase =
window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_PUBLISHABLE_KEY
);


const form =
document.getElementById("registerForm");

const button =
document.getElementById("registerButton");

const message =
document.getElementById("message");


function showMessage(text, type) {

  message.textContent = text;

  message.className =
    "message " + type;

}


form.addEventListener(
  "submit",
  async function(event) {

    event.preventDefault();


    const fullName =
      document
        .getElementById("fullName")
        .value
        .trim();


    const email =
      document
        .getElementById("email")
        .value
        .trim()
        .toLowerCase();


    const password =
      document
        .getElementById("password")
        .value;


    const confirmPassword =
      document
        .getElementById("confirmPassword")
        .value;


    if (password.length < 8) {

      showMessage(
        "Password minimal 8 karakter.",
        "error"
      );

      return;
    }


    if (password !== confirmPassword) {

      showMessage(
        "Konfirmasi password tidak sama.",
        "error"
      );

      return;
    }


    button.disabled = true;

    button.textContent =
      "Mendaftarkan...";


    message.className =
      "message";


    /*
      Setelah email diverifikasi,
      pengguna diarahkan kembali ke login.
    */

    const redirectTo =
      "https://rofidn.github.io/Rofidin-ilyas/login.html";


    const { data, error } =
      await supabase.auth.signUp({

        email: email,

        password: password,

        options: {

          emailRedirectTo: redirectTo,

          data: {

            full_name: fullName

          }

        }

      });


    if (error) {

      showMessage(
        "Pendaftaran gagal: " +
        error.message,
        "error"
      );

      button.disabled = false;

      button.textContent =
        "Daftar";

      return;
    }


    /*
      Jika Supabase meminta
      verifikasi email.
    */

    if (
      data.user &&
      !data.session
    ) {

      showMessage(
        "Pendaftaran berhasil! Silakan cek email kamu dan klik link verifikasi. Setelah terverifikasi, kembali ke halaman Login.",
        "success"
      );

    } else {

      showMessage(
        "Pendaftaran berhasil. Mengalihkan ke Login...",
        "success"
      );


      setTimeout(
        function() {

          window.location.href =
            "login.html";

        },
        1500
      );

    }


    button.disabled = false;

    button.textContent =
      "Daftar";

  });

</script>

</body>
</html>
