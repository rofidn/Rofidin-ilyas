<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register | Rofidin Ilyas</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.4"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background:
        radial-gradient(circle at 20% 20%, rgba(0, 140, 255, 0.18), transparent 35%),
        radial-gradient(circle at 80% 80%, rgba(0, 220, 255, 0.12), transparent 35%),
        #020817;
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 25px;
      overflow-x: hidden;
    }

    .grid {
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(0, 150, 255, 0.06) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0, 150, 255, 0.06) 1px, transparent 1px);
      background-size: 35px 35px;
      pointer-events: none;
    }

    .register-box {
      width: 100%;
      max-width: 440px;
      padding: 35px 30px;
      border: 1px solid rgba(0, 180, 255, 0.35);
      border-radius: 22px;
      background: rgba(5, 18, 38, 0.82);
      backdrop-filter: blur(15px);
      box-shadow:
        0 0 35px rgba(0, 140, 255, 0.12),
        inset 0 0 25px rgba(0, 180, 255, 0.03);
      position: relative;
      z-index: 2;
    }

    .logo {
      width: 70px;
      height: 70px;
      margin: 0 auto 18px;
      border-radius: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 25px;
      font-weight: bold;
      letter-spacing: 2px;
      color: #8eeaff;
      border: 1px solid #00bfff;
      box-shadow:
        0 0 15px rgba(0, 191, 255, 0.55),
        inset 0 0 15px rgba(0, 191, 255, 0.12);
      background: rgba(0, 130, 255, 0.08);
    }

    h1 {
      text-align: center;
      font-size: 27px;
      margin-bottom: 8px;
    }

    .subtitle {
      text-align: center;
      color: #8fa9c5;
      font-size: 14px;
      margin-bottom: 28px;
    }

    label {
      display: block;
      font-size: 13px;
      color: #a9c5df;
      margin-bottom: 7px;
    }

    .input-group {
      margin-bottom: 17px;
    }

    input {
      width: 100%;
      padding: 14px 15px;
      border-radius: 11px;
      border: 1px solid rgba(0, 170, 255, 0.25);
      background: rgba(0, 8, 22, 0.75);
      color: white;
      outline: none;
      font-size: 14px;
      transition: 0.2s;
    }

    input:focus {
      border-color: #00bfff;
      box-shadow: 0 0 12px rgba(0, 191, 255, 0.22);
    }

    input::placeholder {
      color: #58718c;
    }

    button {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 11px;
      background: linear-gradient(90deg, #0077ff, #00c6ff);
      color: white;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 5px;
      box-shadow: 0 0 18px rgba(0, 160, 255, 0.25);
      transition: 0.2s;
    }

    button:hover {
      transform: translateY(-1px);
      box-shadow: 0 0 25px rgba(0, 190, 255, 0.4);
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }

    .message {
      display: none;
      margin-top: 17
