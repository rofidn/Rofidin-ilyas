<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Registrasi user Rofidin Ilyas">
  <title>Registrasi User | Rofidin Ilyas</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{min-height:100vh;font-family:Arial,sans-serif;background:radial-gradient(circle at 20% 20%,rgba(0,140,255,.18),transparent 35%),radial-gradient(circle at 80% 80%,rgba(0,255,170,.14),transparent 35%),linear-gradient(135deg,#07111f,#0c1830 50%,#111827);color:#ebf7ff}
    .grid{position:fixed;inset:0;background-image:linear-gradient(rgba(255,255,255,.04) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.04) 1px,transparent 1px);background-size:24px 24px;mask-image:radial-gradient(circle at center,black 40%,transparent 100%)}
    .register-box{position:relative;z-index:1;width:min(440px,calc(100% - 32px));margin:40px auto;padding:32px 24px;border:1px solid rgba(0,217,255,.24);border-radius:24px;background:rgba(8,15,28,.86);box-shadow:0 0 40px rgba(0,119,255,.14);backdrop-filter:blur(14px)}
    .logo{width:54px;height:54px;display:flex;align-items:center;justify-content:center;margin:0 auto 12px;border-radius:18px;background:linear-gradient(135deg,#00d9ff,#008cff);color:#02111f;font-weight:800;font-size:1.4rem}
    h1{text-align:center;margin-bottom:7px;font-size:1.9rem}p.subtitle{text-align:center;color:#95b5d6;margin-bottom:24px;font-size:.92rem;line-height:1.5}
    .input-group{margin-bottom:16px}.input-group label{display:block;color:#d5f1ff;margin-bottom:7px;font-size:.88rem;font-weight:700}
    input,select{width:100%;padding:13px 14px;border:1px solid rgba(0,217,255,.25);border-radius:12px;background:#071827;color:#edf9ff;outline:none;font-size:1rem}
    input:focus,select:focus{border-color:#00d9ff;box-shadow:0 0 0 3px rgba(0,217,255,.18)}
    select option{background:#071827;color:#edf9ff}
    button[type="submit"]{width:100%;padding:14px;border:none;border-radius:999px;background:linear-gradient(135deg,#00d9ff,#00a8ff);color:#02111f;font-size:1rem;font-weight:800;cursor:pointer}
    button:disabled{opacity:.65;cursor:not-allowed}
    .message{display:none;margin-top:18px;padding:12px 14px;border-radius:12px;text-align:center;font-size:.9rem;line-height:1.5}
    .message.error{display:block;background:rgba(255,0,80,.12);border:1px solid rgba(255,0,80,.3);color:#ffb5c7}
    .message.success{display:block;background:rgba(26,214,124,.12);border:1px solid rgba(26,214,124,.3);color:#baf4d4}
    .links{margin-top:18px;text-align:center;color:#9fc2db;font-size:.9rem;line-height:1.8}.links a{color:#3edbff;text-decoration:none}
    .privacy{margin-top:14px;color:#7897b2;font-size:.75rem;text-align:center;line-height:1.5}
    @media(max-width:480px){.register-box{margin:22px auto;padding:24px 18px}}
  </style>
</head>
<body>
  <div class="grid"></div>
  <main class="register-box">
    <div class="logo">RI</div>
    <h1>Registrasi User</h1>
    <p class="subtitle">Isi data berikut untuk mendaftarkan diri.</p>

    <form id="registerForm" novalidate>
      <div class="input-group"><label for="fullName">Nama Lengkap</label><input id="fullName" type="text" maxlength="120" autocomplete="name" placeholder="Masukkan nama lengkap" required></div>
      <div class="input-group"><label for="region">Nama Daerah</label><input id="region" type="text" maxlength="100" autocomplete="address-level2" placeholder="Contoh: Cirebon" required></div>
      <div class="input-group"><label for="phone">Nomor HP</label><input id="phone" type="tel" inputmode="tel" maxlength="16" autocomplete="tel" placeholder="08xxxxxxxxxx" required></div>
      <div class="input-group"><label for="gender">Jenis Kelamin</label><select id="gender" required><option value="">Pilih jenis kelamin</option><option value="Laki-laki">Laki-laki</option><option value="Perempuan">Perempuan</option><option value="Lainnya">Lainnya</option></select></div>
      <div class="input-group"><label for="birthDate">Tanggal Lahir</label><input id="birthDate" type="date" required></div>
      <button type="submit" id="registerButton">DAFTAR</button>
    </form>

    <div id="message" class="message" role="alert" aria-live="polite"></div>
    <div class="links"><a href="index.html">← Kembali ke Portfolio</a><br><a href="login.html">Login Admin</a></div>
    <div class="privacy">Data registrasi disimpan untuk keperluan administrasi website dan hanya dapat dilihat oleh admin.</div>
  </main>

  <script>
    const SUPABASE_URL = "https://vufpdlobkoeyjjxjhhzr.supabase.co";
    const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_Za2pqw2-OpNY2ypVP036aw_Xzdk_nkq";
    const supabase = window.supabase ? window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY) : null;
    const form = document.getElementById("registerForm");
    const button = document.getElementById("registerButton");
    const message = document.getElementById("message");
    const birthDate = document.getElementById("birthDate");
    birthDate.max = new Date().toISOString().slice(0,10);

    function showMessage(text,type){message.textContent=text;message.className="message "+type}
    function normalizePhone(value){
      const digits=value.replace(/\D/g,"");
      if(digits.startsWith("62")) return "+"+digits;
      if(digits.startsWith("0")) return "+62"+digits.slice(1);
      return "";
    }
    function errorText(error){
      const msg=(error?.message||"").toLowerCase();
      if(msg.includes("duplicate")||msg.includes("unique")) return "Nomor HP tersebut sudah terdaftar.";
      if(msg.includes("rate limit")||msg.includes("too many")) return "Terlalu banyak percobaan. Silakan tunggu beberapa saat.";
      return "Registrasi gagal. Silakan periksa data lalu coba lagi.";
    }

    if(!supabase){
      showMessage("Sistem registrasi gagal dimuat. Silakan refresh halaman.","error");
      button.disabled=true;
    }else{
      form.addEventListener("submit",async(event)=>{
        event.preventDefault();
        const fullName=document.getElementById("fullName").value.trim();
        const region=document.getElementById("region").value.trim();
        const phone=normalizePhone(document.getElementById("phone").value);
        const gender=document.getElementById("gender").value;
        const birthDateValue=birthDate.value;

        if(fullName.length<2){showMessage("Nama lengkap harus diisi.","error");return}
        if(region.length<2){showMessage("Nama daerah harus diisi.","error");return}
        if(!/^\+62\d{9,13}$/.test(phone)){showMessage("Nomor HP tidak valid. Gunakan nomor Indonesia, contoh 0812xxxx atau +62812xxxx.","error");return}
        if(!gender){showMessage("Silakan pilih jenis kelamin.","error");return}
        if(!birthDateValue||birthDateValue>birthDate.max){showMessage("Tanggal lahir tidak valid.","error");return}

        button.disabled=true;button.textContent="MENYIMPAN...";
        try{
          const {error}=await supabase.from("user_registrations").insert({
            full_name:fullName,region,phone,gender,birth_date:birthDateValue
          });
          if(error) throw error;
          showMessage("Registrasi berhasil. Data Anda sudah tersimpan.","success");
          form.reset();
          birthDate.max=new Date().toISOString().slice(0,10);
        }catch(error){
          console.error(error);
          showMessage(errorText(error),"error");
        }finally{
          button.disabled=false;button.textContent="DAFTAR";
        }
      });
    }
  </script>
</body>
</html>
