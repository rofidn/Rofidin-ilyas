<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Register | Rofidin Ilyas</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.4"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}body{min-height:100vh;font-family:Arial,sans-serif;background:radial-gradient(circle at 20% 20%,rgba(0,140,255,.18),transparent 35%),radial-gradient(circle at 80% 80%,rgba(0,220,255,.12),transparent 35%),#020817;color:#fff;display:flex;justify-content:center;align-items:center;padding:25px}.grid{position:fixed;inset:0;background-image:linear-gradient(rgba(0,150,255,.06) 1px,transparent 1px),linear-gradient(90deg,rgba(0,150,255,.06) 1px,transparent 1px);background-size:35px 35px;pointer-events:none}.register-box{width:100%;max-width:440px;padding:35px 30px;border:1px solid rgba(0,180,255,.35);border-radius:22px;background:rgba(5,18,38,.82);backdrop-filter:blur(15px);box-shadow:0 0 35px rgba(0,140,255,.12);position:relative;z-index:2}.logo{width:70px;height:70px;margin:0 auto 18px;border-radius:18px;display:flex;align-items:center;justify-content:center;font-size:25px;font-weight:bold;letter-spacing:2px;color:#8eeaff;border:1px solid #00bfff;box-shadow:0 0 15px rgba(0,191,255,.55);background:rgba(0,130,255,.08)}h1{text-align:center;font-size:27px;margin-bottom:8px}.subtitle{text-align:center;color:#8fa9c5;font-size:14px;margin-bottom:28px}label{display:block;font-size:13px;color:#a9c5df;margin-bottom:7px}.input-group{margin-bottom:17px}input{width:100%;padding:14px 15px;border-radius:11px;border:1px solid rgba(0,170,255,.25);background:rgba(0,8,22,.75);color:#fff;outline:none;font-size:14px}input:focus{border-color:#00bfff;box-shadow:0 0 12px rgba(0,191,255,.22)}input::placeholder{color:#58718c}button{width:100%;padding:14px;border:0;border-radius:11px;background:linear-gradient(90deg,#0077ff,#00c6ff);color:#fff;font-size:15px;font-weight:bold;cursor:pointer;margin-top:5px}button:disabled{opacity:.6;cursor:not-allowed}.message{display:none;margin-top:17px;padding:12px;border-radius:10px;font-size:13px;line-height:1.5;text-align:center}.success{display:block;background:rgba(0,190,130,.1);border:1px solid rgba(0,220,150,.3);color:#6fffc8}.error{display:block;background:rgba(255,50,80,.1);border:1px solid rgba(255,70,90,.3);color:#ff8799}.login-link{text-align:center;margin-top:22px;font-size:13px;color:#7893ad}.login-link a{color:#4fcaff;text-decoration:none;font-weight:bold}.security{text-align:center;margin-top:20px;font-size:11px;color:#526b84;letter-spacing:.5px}@media(max-width:480px){body{padding:15px}.register-box{padding:28px 20px}h1{font-size:24px}}
</style>
</head>
<body>
<div class="grid"></div><div class="register-box"><div class="logo">RI</div>
<h1>Create Account</h1><p class="subtitle">Daftar untuk mengakses Rofidin Ilyas Portfolio</p>
<form id="registerForm">
<div class="input-group"><label for="fullName">Nama Lengkap</label><input type="text" id="fullName" placeholder="Masukkan nama lengkap" required></div>
<div class="input-group"><label for="email">Email</label><input type="email" id="email" placeholder="nama@email.com" required></div>
<div class="input-group"><label for="password">Password</label><input type="password" id="password" placeholder="Minimal 8 karakter" minlength="8" required></div>
<div class="input-group"><label for="confirmPassword">Konfirmasi Password</label><input type="password" id="confirmPassword" placeholder="Masukkan kembali password" minlength="8" required></div>
<button type="submit" id="registerButton">CREATE ACCOUNT</button></form>
<div id="message" class="message"></div>
<div class="login-link">Sudah punya akun? <a href="login.html">Login di sini</a></div><div class="security">🔒 SECURE ACCOUNT REGISTRATION</div></div>
<script>
const SUPABASE_URL="https://vufpdlobkoeyjjxjhhzr.supabase.co",SUPABASE_PUBLISHABLE_KEY="sb_publishable_Za2pqw2-OpNY2ypVP036aw_Xzdk_nkq",LOGIN_URL="https://rofidn.github.io/Rofidin-ilyas/login.html";
const form=document.getElementById("registerForm"),button=document.getElementById("registerButton"),message=document.getElementById("message");
function showMessage(text,type){message.textContent=text;message.className="message "+type}
function errorText(e){const m=(e?.message||"Pendaftaran gagal.").toLowerCase();if(m.includes("already registered"))return"Email tersebut sudah terdaftar. Silakan login atau gunakan email lain.";if(m.includes("invalid email"))return"Format email tidak valid.";if(m.includes("redirect"))return"Registrasi gagal karena alamat pengalihan belum diizinkan di Supabase.";if(m.includes("failed to fetch")||m.includes("network"))return"Koneksi bermasalah. Periksa internet lalu coba lagi.";return e?.message||"Pendaftaran gagal."}
if(!window.supabase){showMessage("Sistem registrasi gagal dimuat. Silakan refresh halaman.","error")}else{const supabaseClient=window.supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY);
form.addEventListener("submit",async e=>{e.preventDefault();if(!form.checkValidity()){form.reportValidity();return}const fullName=document.getElementById("fullName").value.trim(),email=document.getElementById("email").value.trim(),password=document.getElementById("password").value,confirmPassword=document.getElementById("confirmPassword").value;if(password.length<8){showMessage("Password harus minimal 8 karakter.","error");return}if(password!==confirmPassword){showMessage("Konfirmasi password tidak sama.","error");return}button.disabled=true;button.textContent="CREATING ACCOUNT...";message.className="message";message.textContent="";
try{const{data,error}=await supabaseClient.auth.signUp({email,password,options:{emailRedirectTo:LOGIN_URL,data:{full_name:fullName}}});if(error)throw error;if(!data?.user)throw new Error("Akun tidak berhasil dibuat. Silakan coba lagi.");showMessage("Registrasi berhasil! Mengarahkan ke halaman login...","success");form.reset();setTimeout(()=>window.location.href=LOGIN_URL,1800)}catch(err){console.error(err);showMessage(errorText(err),"error");button.disabled=false;button.textContent="CREATE ACCOUNT"}});
}
</script>
</body>
</html>
