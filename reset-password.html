<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="description" content="Buat password baru akun Rofidin Ilyas"><title>Buat Password Baru | Rofidin Ilyas</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.4"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:Inter,Arial,sans-serif}body{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;color:#fff;background:radial-gradient(circle at top right,#003b73,transparent 35%),radial-gradient(circle at bottom left,#001f3f,transparent 35%),#020817}.box{width:100%;max-width:430px;padding:35px 28px;border:1px solid #00d9ff44;border-radius:25px;background:rgba(5,20,40,.78);backdrop-filter:blur(15px);box-shadow:0 0 45px #0077ff22}.logo{text-align:center;font-size:42px;font-weight:700;color:#00d9ff;text-shadow:0 0 20px #00d9ff;margin-bottom:10px}h1{text-align:center;margin-bottom:8px;font-size:28px}.subtitle{text-align:center;color:#91aac3;margin-bottom:30px;line-height:1.5;font-size:14px}label{display:block;margin-bottom:8px;color:#bdefff;font-size:14px;font-weight:500}input{width:100%;padding:14px;margin-bottom:18px;border-radius:12px;border:1px solid #00d9ff44;outline:none;background:#061426;color:white;font-size:15px}button{width:100%;padding:14px;border:0;border-radius:25px;background:#00bfff;color:#00101c;font-size:16px;font-weight:600;cursor:pointer}button:disabled{opacity:.6;cursor:not-allowed}.message{display:none;margin-top:18px;padding:13px;border-radius:10px;text-align:center;font-size:14px;line-height:1.5}.error{display:block;background:#ff003322;border:1px solid #ff446655;color:#ff9b9b}.success{display:block;background:#00ff9922;border:1px solid #00ff9966;color:#8affc1}.links{margin-top:25px;text-align:center;font-size:14px}.links a{color:#00d9ff;text-decoration:none}.links a:hover{text-decoration:underline}
</style>
</head>
<body><main class="box"><div class="logo">RI</div><h1>Buat Password Baru</h1><p class="subtitle">Masukkan password baru untuk akun Anda.</p>
<form id="resetForm"><label for="newPassword">Password Baru</label><input type="password" id="newPassword" placeholder="Minimal 8 karakter" minlength="8" autocomplete="new-password" required><label for="confirmPassword">Konfirmasi Password</label><input type="password" id="confirmPassword" placeholder="Masukkan kembali password" minlength="8" autocomplete="new-password" required><button type="submit" id="submitButton">Simpan Password Baru</button></form>
<div id="message" class="message" role="alert" aria-live="polite"></div><div class="links"><a href="login.html">← Kembali ke Login</a></div></main>
<script>
const SUPABASE_URL="https://vufpdlobkoeyjjxjhhzr.supabase.co",SUPABASE_PUBLISHABLE_KEY="sb_publishable_Za2pqw2-OpNY2ypVP036aw_Xzdk_nkq";
const supabase=window.supabase?window.supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY):null;
const form=document.getElementById("resetForm"),button=document.getElementById("submitButton"),message=document.getElementById("message");
function showMessage(text,type){message.textContent=text;message.className="message "+type}
let recoveryReady=false;
let sessionCheckTimer=null;
if(supabase){
 supabase.auth.onAuthStateChange((event,session)=>{
  if(session){
    recoveryReady=true;
    if(sessionCheckTimer) clearTimeout(sessionCheckTimer);
  } else if(event==="SIGNED_OUT"){
    recoveryReady=false;
  }
 });
 supabase.auth.getSession().then(({data,error})=>{
  if(!error&&data.session){
    recoveryReady=true;
    if(sessionCheckTimer) clearTimeout(sessionCheckTimer);
  } else if(error){
    showMessage("Link reset tidak dapat diproses. Silakan minta link reset baru.","error");
    button.disabled=true;
  }
 });
 sessionCheckTimer=setTimeout(()=>{
  if(!recoveryReady){
    showMessage("Link reset tidak valid atau sudah kedaluwarsa. Silakan minta link reset baru.","error");
    button.disabled=true;
  }
},4000);
}else{showMessage("Sistem reset password gagal dimuat. Silakan refresh halaman.","error");button.disabled=true}
form.addEventListener("submit",async e=>{
 e.preventDefault();if(!supabase)return;if(!recoveryReady){showMessage("Link reset belum siap. Tunggu sebentar atau minta link reset baru.","error");return}
 const p=document.getElementById("newPassword").value,c=document.getElementById("confirmPassword").value;
 if(p.length<8){showMessage("Password harus minimal 8 karakter.","error");return}
 if(p!==c){showMessage("Konfirmasi password tidak sama.","error");return}
 button.disabled=true;button.textContent="Menyimpan...";
 try{
  const {error}=await supabase.auth.updateUser({password:p});if(error)throw error;
  showMessage("Password berhasil diubah. Anda akan diarahkan ke halaman login.","success");form.reset();
  await supabase.auth.signOut({scope:"local"});
  setTimeout(()=>window.location.replace(new URL("login.html",window.location.href).href),1200);
 }catch(err){console.error(err);showMessage("Gagal mengubah password. Link mungkin sudah kedaluwarsa. Silakan minta link reset baru.","error")}
 finally{button.disabled=false;button.textContent="Simpan Password Baru"}
});
</script></body></html>
