<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Login | Rofidin Ilyas</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.4"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      color: white;
      background:
        radial-gradient(circle at top right, #003b73, transparent 35%),
        radial-gradient(circle at bottom left, #001f3f, transparent 35%),
        #020817;
    }

    .login-box {
      width: 100%;
      max-width: 430px;
      padding: 35px 28px;
      border: 1px solid #00d9ff44;
      border-radius: 25px;
      background: rgba(5, 20, 40, 0.75);
      backdrop-filter: blur(15px);
      box-shadow: 0 0 45px #0077ff22;
    }

    .logo {
      text-align: center;
      font-size: 42px;
      font-weight: bold;
      color: #00d9ff;
      text-shadow: 0 0 20px #00d9ff;
      margin-bottom: 10px;
    }

    h1 {
      text-align: center;
      margin-bottom: 8px;
    }

    .subtitle {
      text-align: center;
      color: #91aac3;
      margin-bottom: 30px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      color: #bdefff;
      font-size: 14px;
    }

    input {
      width: 100%;
      padding: 14px;
      margin-bottom: 18px;
      border-radius: 12px;
      border: 1px solid #00d9ff44;
      outline: none;
      background: #061426;
      color: white;
      font-size: 15px;
    }

    input:focus {
      border-color: #00d9ff;
      box-shadow: 0 0 12px #00d9ff33;
    }

    button {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 25px;
      background: #00bfff;
      color: #00101c;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 0 20px #00bfff55;
    }

    button:hover {
      transform: translateY(-2px);
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .message {
      display: none;
      margin-top: 18px;
      padding: 12px;
      border-radius: 10px;
      text-align: center;
      font-size: 14px;
    }

    .error {
      display: block;
      background: #ff003322;
      border: 1px solid #ff446655;
      color: #ff9b9b;
    }

    .success {
      display: block;
      background: #00ff9922;
      border: 1px solid #00ff9966;
      color: #8affc1;
    }

    .links {
      margin-top: 25px;
      text-align: center;
      line-height: 2;
    }

    .links a {
      color: #00d9ff;
      text-decoration: none;
    }

    .links a:hover {
      text-decoration: underline;
    }

    .back {
      display: block;
      margin-top: 18px;
      color: #71869d !important;
    }
  </style>
</head>

<body>

  <div class="login-box">

    <div class="logo">RI</div>

    <h1>Login</h1>

    <p class="subtitle">
      Masuk ke Rofidin Ilyas Portfolio
    </p>

    <form id="loginForm">

      <label for="email">Email</label>

      <input
        type="email"
        id="email"
        placeholder="Masukkan email"
        required
      >

      <label for="password">Password</label>

      <input
        type="password"
        id="password"
        placeholder="Masukkan password"
        required
      >

      <button type="submit" id="loginButton">
        Login
      </button>

    </form>

    <div id="message" class="message"></div>

    <div class="links">

      <a href="forgot-password.html">
        Lupa password?
      </a>

      <br>

      Belum punya akun?
      <a href="register.html">
        Daftar
      </a>

      <a href="index.html" class="back">
        ← Kembali ke Portfolio
      </a>

    </div>

  </div>

<script>
  const SUPABASE_URL =
    "https://vufpdlobkoeyjjxjhhzr.supabase.co";

  const SUPABASE_PUBLISHABLE_KEY =
    "sb_publishable_Za2pqw2-OpNY2ypVP036aw_Xzdk_nkq";

  const supabase = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_PUBLISHABLE_KEY
  );

  const form = document.getElementById("loginForm");
  const button = document.getElementById("loginButton");
  const message = document.getElementById("message");

  function showMessage(text, type) {
    message.textContent = text;
    message.className = "message " + type;
  }

  form.addEventListener("submit", async (event) => {

    event.preventDefault();

    const email =
      document.getElementById("email").value.trim();

    const password =
      document.getElementById("password").value;

    button.disabled = true;
    button.textContent = "Memproses...";

    message.className = "message";
    message.textContent = "";

    const { data, error } =
      await supabase.auth.signInWithPassword({
        email,
        password
      });

    if (error) {

      showMessage(
        "Login gagal: " + error.message,
        "error"
      );

      button.disabled = false;
      button.textContent = "Login";

      return;
    }

    showMessage(
      "Login berhasil. Mengalihkan...",
      "success"
    );

    setTimeout(() => {
      window.location.href = "dashboard.html";
    }, 1000);

  });
</script>

</body>
</html>
