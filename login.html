<!DOCTYPE html>
<html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Login | Rofidin Ilyas</title>
<style>*{box-sizing:border-box}body{min-height:100vh;margin:0;display:flex;align-items:center;justify-content:center;padding:20px;font-family:Inter,Arial,sans-serif;color:#fff;background:radial-gradient(circle at top right,#003b73,transparent 35%),#020817}.box{width:100%;max-width:430px;padding:32px 26px;border:1px solid #00d9ff44;border-radius:24px;background:#051428dd;box-shadow:0 20px 60px #0006}.logo{text-align:center;color:#00d9ff;font-size:40px;font-weight:800;margin-bottom:8px}h1{text-align:center;margin:0 0 7px}.sub{text-align:center;color:#91aac3;margin:0 0 25px;font-size:14px}label{display:block;color:#bdefff;margin:0 0 7px;font-size:13px}input{width:100%;padding:13px;margin-bottom:16px;border-radius:11px;border:1px solid #00d9ff44;background:#061426;color:#fff;outline:0}input:focus{border-color:#00d9ff}button{width:100%;padding:13px;border:0;border-radius:22px;background:#00c3ff;color:#00101c;font-weight:800;cursor:pointer}button:disabled{opacity:.6}.msg{display:none;margin-top:16px;padding:11px;border-radius:10px;text-align:center;font-size:13px;line-height:1.5}.msg.error{display:block;background:#ff003322;color:#ffb0b0;border:1px solid #ff446655}.msg.success{display:block;background:#00ff9922;color:#8affc1;border:1px solid #00ff9966}.links{text-align:center;margin-top:18px;line-height:2;font-size:13px}.links a{color:#00d9ff;text-decoration:none}</style></head>
<body><main class="box"><div class="logo">RI</div><h1>Login</h1><p class="sub">Admin dan User menggunakan satu halaman login.</p>
<form id="form"><label>Email</label><input id="email" type="email" autocomplete="email" required><label>Password</label><input id="password" type="password" autocomplete="current-password" required><button id="btn">LOGIN</button></form>
<div id="msg" class="msg"></div><div class="links"><a href="register.html">Belum punya akun? Registrasi User</a><br><a href="forgot-password.html">Lupa password?</a><br><a href="index.html">← Kembali ke Portfolio</a></div></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.4"></script><script>
const supabase=window.supabase.createClient("https://vufpdlobkoeyjjxjhhzr.supabase.co","sb_publishable_Za2pqw2-OpNY2ypVP036aw_Xzdk_nkq");
const form=document.getElementById("form"),btn=document.getElementById("btn"),msg=document.getElementById("msg");
function show(t,c){msg.textContent=t;msg.className="msg "+c}
let routing=false;
async function route(session){
 if(routing||!session?.user)return;
 routing=true;
 const id=session.user.id;
 try{
  const {data:admin,error:adminError}=await supabase.from("admin_profiles").select("role,is_active").eq("auth_user_id",id).eq("is_active",true).maybeSingle();
  if(adminError)throw new Error("Gagal memeriksa akses admin: "+adminError.message);
  if(admin?.role==="super_admin"){
   show("Login berhasil. Membuka Dashboard Admin...","success");
   setTimeout(()=>window.location.assign("./dashboard.html"),150);
   return;
  }
  const {data:user,error:userError}=await supabase.from("user_registrations").select("id").eq("auth_user_id",id).maybeSingle();
  if(userError)throw new Error("Gagal memeriksa data user: "+userError.message);
  if(user){
   show("Login berhasil. Membuka Dashboard User...","success");
   setTimeout(()=>window.location.assign("./user-dashboard.html"),150);
   return;
  }
  await supabase.auth.signOut({scope:"local"});
  routing=false;
  show("Akun berhasil login, tetapi belum terdaftar sebagai Admin/User. Silakan periksa data akun.","error");
 }catch(err){
  console.error("Route error:",err);
  routing=false;
  show(err.message||"Gagal membuka dashboard.","error");
 }
}
const params=new URLSearchParams(location.search);if(params.get("registered")==="1")show("Registrasi berhasil. Jika diminta verifikasi, cek email terlebih dahulu, lalu login.","success");
supabase.auth.onAuthStateChange((event,session)=>{if(event==="SIGNED_IN"&&session&&!routing)void route(session)});
form.addEventListener("submit",async e=>{
 e.preventDefault();btn.disabled=true;btn.textContent="MEMPROSES...";msg.className="msg";
 try{const {data,error}=await supabase.auth.signInWithPassword({email:document.getElementById("email").value.trim().toLowerCase(),password:document.getElementById("password").value});if(error)throw error;show("Login berhasil. Memeriksa akses...","success");await route(data.session)}
 catch(err){const m=(err.message||"").toLowerCase();show(m.includes("email not confirmed")?"Email belum diverifikasi. Cek inbox lalu klik tautan verifikasi.":m.includes("invalid login credentials")?"Email atau password salah.":"Login gagal. Silakan coba lagi.","error")}
 finally{btn.disabled=false;btn.textContent="LOGIN"}
});
</script></body></html>
