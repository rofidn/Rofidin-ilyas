<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="description" content="Reset password akun Rofidin Ilyas">
<title>Lupa Password | Rofidin Ilyas</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.4"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:Inter,Arial,sans-serif}
body{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;color:#fff;background:radial-gradient(circle at top right,#003b73,transparent 35%),radial-gradient(circle at bottom left,#001f3f,transparent 35%),#020817}
.box{width:100%;max-width:430px;padding:35px 28px;border:1px solid #00d9ff44;border-radius:25px;background:rgba(5,20,40,.78);backdrop-filter:blur(15px);box-shadow:0 0 45px #0077ff22}
.logo{text-align:center;font-size:42px;font-weight:700;color:#00d9ff;text-shadow:0 0 20px #00d9ff;margin-bottom:10px}
h1{text-align:center;margin-bottom:8px;font-size:28px}.subtitle{text-align:center;color:#91aac3;margin-bottom:30px;line-height:1.5;font-size:14px}
label{display:block;margin-bottom:8px;color:#bdefff;font-size:14px;font-weight:500}
input{width:100%;padding:14px;margin-bottom:18px;border-radius:12px;border:1px solid #00d9ff44;outline:none;background:#061426;color:white;font-size:15px}
button{width:100%;padding:14px;border:0;border-radius:25px;background:#00bfff;color:#00101c;font-size:16px;font-weight:600;cursor:pointer}
button:disabled{opacity:.6;cursor:not-allowed}.message{display:none;margin-top:18px;padding:13px;border-radius:10px;text-align:center;font-size:14px;line-height:1.5}
.error{display:block;background:#ff003322;border:1px solid #ff446655;color:#ff9b9b}.success{display:block;background:#00ff9922;border:1px solid #00ff9966;color:#8affc1}
.links{margin-top:25px;text-align:center;font-size:14px}.links a{color:#00d9ff;text-decoration:none}.links a:hover{text-decoration:underline}
</style>
</head>
<body>
<main class="box">
<div class="logo">RI</div>
<h1>Lupa Password</h1>
<p class="subtitle">Masukkan email akun Anda. Kami akan mengirim tautan untuk membuat password baru.</p>
<form id="requestForm">
<label for="email">Email</label>
<input type="email" id="email" placeholder="nama@email.com" autocomplete="email" required>
<button type="submit" id="submitButton">Kirim Link Reset</button>
</form>
<div id="message" class="message" role="alert" aria-live="polite"></div>
<div class="links"><a href="login.html">← Kembali ke Login</a></div>
</main>
<script>
const SUPABASE_URL="https://vufpdlobkoeyjjxhhzr.supabase.co";
const SUPABASE_PUBLISHABLE_KEY="sb_publishable_Za2pqw2-OpNY2ypVP036aw_Xzdk_nkq";
const supabase=window.supabase?window.supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY):null;
const form=document.getElementById("requestForm");
const button=document.getElementById("submitButton");
const message=document.getElementById("message");
const RESET_URL=new URL("reset-password.html",window.location.href).href;

function showMessage(text,type){
 message.textContent=text;
 message.className="message "+type;
}

form.addEventListener("submit",async(event)=>{
 event.preventDefault();
 if(!supabase){
  showMessage("Sistem reset password gagal dimuat. Silakan refresh halaman.","error");
  return;
 }
 const email=document.getElementById("email").value.trim().toLowerCase();
 if(!email||!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){
  showMessage("Format email tidak valid.","error");
  return;
 }
 button.disabled=true;
 button.textContent="Mengirim...";
 try{
  const {error}=await supabase.auth.resetPasswordForEmail(email,{redirectTo:RESET_URL});
  if(error)throw error;
  showMessage("Jika email tersebut terdaftar, link reset password sudah dikirim. Silakan cek inbox dan folder spam.","success");
  form.reset();
 }catch(error){
  const msg=String(error?.message||"").toLowerCase();
  if(msg.includes("rate limit")||msg.includes("too many")){
   showMessage("Terlalu banyak permintaan. Tunggu beberapa saat sebelum mencoba lagi.","error");
  }else if(msg.includes("redirect")||msg.includes("url")){
   showMessage("URL reset belum diizinkan oleh konfigurasi Auth. Hubungi admin untuk memperbaikinya.","error");
  }else{
   showMessage("Permintaan reset password gagal. Silakan coba lagi nanti.","error");
  }
 }finally{
  button.disabled=false;
  button.textContent="Kirim Link Reset";
 }
});
</script>
</body>
</html>
