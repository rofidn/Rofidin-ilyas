<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Reset password akun Rofidin Ilyas">
  <title>Reset Password | Rofidin Ilyas</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.4"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
    body {
      min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px;
      color: white;
      background: radial-gradient(circle at top right, #003b73, transparent 35%),
        radial-gradient(circle at bottom left, #001f3f, transparent 35%), #020817;
    }
    .box {
      width: 100%; max-width: 430px; padding: 35px 28px; border: 1px solid #00d9ff44;
      border-radius: 25px; background: rgba(5, 20, 40, .78); backdrop-filter: blur(15px);
      box-shadow: 0 0 45px #0077ff22;
    }
    .logo { text-align: center; font-size: 42px; font-weight: 700; color: #00d9ff; text-shadow: 0 0 20px #00d9ff; margin-bottom: 10px; }
    h1 { text-align: center; margin-bottom: 8px; font-size: 28px; }
    .subtitle { text-align: center; color: #91aac3; margin-bottom: 30px; line-height: 1.5; font-size: 14px; }
    label { display: block; margin-bottom: 8px; color: #bdefff; font-size: 14px; font-weight: 500; }
    input {
      width: 100%; padding: 14px; margin-bottom: 18px; border-radius: 12px;
      border: 1px solid #00d9ff44; outline: none; background: #061426; color: white; font-size: 15px;
    }
    input:focus { border-color: #00d9ff; box-shadow: 0 0 12px #00d9ff33; }
    button {
      width: 100%; padding: 14px; border: 0; border-radius: 25px; background: #00bfff;
      color: #00101c; font-size: 16px; font-weight: 600; cursor: pointer; box-shadow: 0 0 20px #00bfff55;
    }
    button:disabled { opacity: .6; cursor: not-allowed; }
    .message { display: none; margin-top: 18px; padding: 13px; border-radius: 10px; text-align: center; font-size: 14px; line-height: 1.5; }
    .error { display: block; background: #ff003322; border: 1px solid #ff446655; color: #ff9b9b; }
    .success { display: block; background: #00ff9922; border: 1px solid #00ff9966; color: #8affc1; }
    .links { margin-top: 25px; text-align: center; font-size: 14px; }
    .links a { color: #00d9ff; text-decoration: none; }
    .links a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <main class="box">
    <div class="logo">RI</div>
    <h1>Reset Password</h1>
    <p class="subtitle">Masukkan password baru Anda untuk mengganti yang lama.</p>

    <form id="resetForm" novalidate>
      <label for="newPassword">Password Baru</label>
      <input type="password" id="newPassword" placeholder="Minimal 8 karakter" minlength="8" required>

      <label for="confirmPassword">Konfirmasi Password</label>
      <input type="password" id="confirmPassword" placeholder="Masukkan kembali password" minlength="8" required>

      <button type="submit" id="submitButton">Reset Password</button>
    </form>

    <div id="message" class="message" role="alert" aria-live="polite" aria-atomic="true"></div>

    <div class="links">
      <a href="login.html">← Kembali ke Login</a>
    </div>
  </main>

  <script>
    const SUPABASE_URL = "https://vufpdlobkoeyjjxjhhzr.supabase.co";
    const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_Za2pqw2-OpNY2ypVP036aw_Xzdk_nkq";
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);

    const form = document.getElementById("resetForm");
    const button = document.getElementById("submitButton");
    const message = document.getElementById("message");

    function showMessage(text, type) {
      message.textContent = text;
      message.className = `message ${type}`;
    }

    async function checkSession() {
      const { data: { session }, error } = await supabase.auth.getSession();

      if (error || !session) {
        showMessage("Sesi tidak valid. Silakan minta link reset ulang.", "error");
        button.disabled = true;
        setTimeout(() => {
          window.location.replace(new URL("forgot-password.html", window.location.href).href);
        }, 2000);
        return false;
      }

      return true;
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();

      const newPassword = document.getElementById("newPassword").value;
      const confirmPassword = document.getElementById("confirmPassword").value;

      if (newPassword.length < 8) {
        showMessage("Password harus minimal 8 karakter.", "error");
        return;
      }

      if (newPassword !== confirmPassword) {
        showMessage("Konfirmasi password tidak sama.", "error");
        return;
      }

      button.disabled = true;
      button.textContent = "Memproses...";
      message.className = "message";
      message.textContent = "";

      try {
        const { error } = await supabase.auth.updateUser({ password: newPassword });

        if (error) {
          showMessage("Gagal mengubah password: " + error.message, "error");
          console.error(error);
          return;
        }

        showMessage("Password berhasil diubah! Mengalihkan ke login...", "success");
        form.reset();

        setTimeout(() => {
          window.location.replace(new URL("login.html", window.location.href).href);
        }, 1500);
      } catch (err) {
        showMessage("Terjadi kesalahan. Silakan coba lagi.", "error");
        console.error(err);
      } finally {
        button.disabled = false;
        button.textContent = "Reset Password";
      }
    });

    checkSession();
  </script>
</body>
</html>
