<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Reset password akun Rofidin Ilyas">
  <title>Lupa Password | Rofidin Ilyas</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.4"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
    body {
      min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px;
      color: white;
      background: radial-gradient(circle at top right, #003b73, transparent 35%),
        radial-gradient(circle at bottom left, #001f3f, transparent 35%), #020817;
    }
    .box {
      width: 100%; max-width: 430px; padding: 35px 28px; border: 1px solid #00d9ff44;
      border-radius: 25px; background: rgba(5, 20, 40, .78); backdrop-filter: blur(15px);
      box-shadow: 0 0 45px #0077ff22;
    }
    .logo { text-align: center; font-size: 42px; font-weight: 700; color: #00d9ff; text-shadow: 0 0 20px #00d9ff; margin-bottom: 10px; }
    h1 { text-align: center; margin-bottom: 8px; font-size: 28px; }
    .subtitle { text-align: center; color: #91aac3; margin-bottom: 30px; line-height: 1.5; font-size: 14px; }
    label { display: block; margin-bottom: 8px; color: #bdefff; font-size: 14px; font-weight: 500; }
    input {
      width: 100%; padding: 14px; margin-bottom: 18px; border-radius: 12px;
      border: 1px solid #00d9ff44; outline: none; background: #061426; color: white; font-size: 15px;
    }
    input:focus { border-color: #00d9ff; box-shadow: 0 0 12px #00d9ff33; }
    button {
      width: 100%; padding: 14px; border: 0; border-radius: 25px; background: #00bfff;
      color: #00101c; font-size: 16px; font-weight: 600; cursor: pointer; box-shadow: 0 0 20px #00bfff55;
    }
    button:disabled { opacity: .6; cursor: not-allowed; }
    .message { display: none; margin-top: 18px; padding: 13px; border-radius: 10px; text-align: center; font-size: 14px; line-height: 1.5; }
    .error { display: block; background: #ff003322; border: 1px solid #ff446655; color: #ff9b9b; }
    .success { display: block; background: #00ff9922; border: 1px solid #00ff9966; color: #8affc1; }
    .links { margin-top: 25px; text-align: center; font-size: 14px; }
    .links a { color: #00d9ff; text-decoration: none; }
    .links a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <main class="box">
    <div class="logo">RI</div>
    <h1>Lupa Password</h1>
    <p class="subtitle">Masukkan email akun Anda untuk menerima link pengaturan password baru.</p>

    <form id="forgotPasswordForm" novalidate>
      <label for="email">Email</label>
      <input type="email" id="email" placeholder="Masukkan email" autocomplete="email" required>
      <button type="submit" id="submitButton">Kirim Link Reset</button>
    </form>

    <div id="message" class="message" role="alert" aria-live="polite" aria-atomic="true"></div>

    <div class="links">
      <a href="login.html">← Kembali ke Login</a>
    </div>
  </main>

  <script>
    const SUPABASE_URL = "https://vufpdlobkoeyjjxjhhzr.supabase.co";
    const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_Za2pqw2-OpNY2ypVP036aw_Xzdk_nkq";
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);

    const form = document.getElementById("forgotPasswordForm");
    const button = document.getElementById("submitButton");
    const message = document.getElementById("message");

    function showMessage(text, type) {
      message.textContent = text;
      message.className = `message ${type}`;
    }

    function isValidEmail(email) {
      return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      const email = document.getElementById("email").value.trim().toLowerCase();

      if (!isValidEmail(email)) {
        showMessage("Masukkan alamat email yang valid.", "error");
        return;
      }

      button.disabled = true;
      button.textContent = "Mengirim...";
      message.className = "message";
      message.textContent = "";

      try {
        // Halaman ini harus didaftarkan di Supabase Auth > URL Configuration.
        const resetUrl = `${window.location.origin}${window.location.pathname.replace(/[^/]*$/, "")}reset-password.html`;
        const { error } = await supabase.auth.resetPasswordForEmail(email, { redirectTo: resetUrl });

        if (error) {
          showMessage("Gagal mengirim link reset: " + error.message, "error");
          return;
        }

        showMessage("Link reset password telah dikirim. Silakan cek inbox atau folder spam email Anda.", "success");
        form.reset();
      } catch (error) {
        showMessage("Terjadi kesalahan. Silakan coba lagi.", "error");
        console.error(error);
      } finally {
        button.disabled = false;
        button.textContent = "Kirim Link Reset";
      }
    });
  </script>
</body>
</html>
