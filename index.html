<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Rofidin Ilyas | Portfolio</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      background:
        radial-gradient(circle at top right, #003b73, transparent 35%),
        radial-gradient(circle at bottom left, #001f3f, transparent 35%),
        #020817;
      color: white;
      overflow-x: hidden;
    }

    .container {
      max-width: 1100px;
      margin: auto;
      padding: 30px 20px;
    }

    nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 15px 0;
    }

    .logo {
      font-size: 28px;
      font-weight: bold;
      color: #00d9ff;
      text-shadow: 0 0 15px #00d9ff;
    }

    .nav-link {
      color: #b8dfff;
      text-decoration: none;
      border: 1px solid #00d9ff55;
      padding: 10px 18px;
      border-radius: 20px;
    }

    .hero {
      min-height: 75vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
    }

    .card {
      width: 100%;
      max-width: 800px;
      padding: 50px 30px;
      border: 1px solid #00d9ff44;
      border-radius: 25px;
      background: rgba(5, 20, 40, 0.65);
      backdrop-filter: blur(12px);
      box-shadow: 0 0 40px #0077ff22;
    }

    .badge {
      display: inline-block;
      padding: 8px 15px;
      border-radius: 20px;
      border: 1px solid #00d9ff66;
      color: #00d9ff;
      margin-bottom: 20px;
      font-size: 14px;
    }

    h1 {
      font-size: clamp(40px, 8vw, 72px);
      margin-bottom: 15px;
    }

    h1 span {
      color: #00d9ff;
      text-shadow: 0 0 20px #00d9ff88;
    }

    .description {
      color: #b9cce0;
      line-height: 1.8;
      max-width: 650px;
      margin: auto;
    }

    .buttons {
      margin-top: 30px;
      display: flex;
      justify-content: center;
      gap: 15px;
      flex-wrap: wrap;
    }

    .btn {
      padding: 13px 25px;
      border-radius: 25px;
      text-decoration: none;
      font-weight: bold;
      transition: 0.3s;
    }

    .primary {
      background: #00bfff;
      color: #00101c;
      box-shadow: 0 0 20px #00bfff66;
    }

    .secondary {
      border: 1px solid #00d9ff66;
      color: #bdefff;
    }

    .btn:hover {
      transform: translateY(-3px);
    }

    footer {
      text-align: center;
      color: #71869d;
      padding: 20px;
      font-size: 13px;
    }
  </style>
</head>

<body>

  <div class="container">

    <nav>
      <div class="logo">RI</div>

      <a href="login.html" class="nav-link">
        Login
      </a>
    </nav>

    <section class="hero">

      <div class="card">

        <div class="badge">
          QUALITY CONTROL • ADMIN • TELECOM
        </div>

        <h1>
          Rofidin <span>Ilyas</span>
        </h1>

        <p class="description">
          Selamat datang di portfolio saya.
          Saya memiliki pengalaman di bidang Regional Quality Control,
          Timekeeping, administrasi, dan proyek telekomunikasi.
        </p>

        <div class="buttons">

          <a href="login.html" class="btn primary">
            Admin / Login
          </a>

          <a href="#about" class="btn secondary">
            Lihat Portfolio
          </a>

        </div>

      </div>

    </section>

    <footer>
      © 2026 Rofidin Ilyas • Portfolio
    </footer>

  </div>

</body>
</html>
