<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Dashboard | Rofidin Ilyas</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.4"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      color: white;
      background:
        radial-gradient(circle at top right, #003b73, transparent 35%),
        radial-gradient(circle at bottom left, #001f3f, transparent 35%),
        #020817;
    }

    .container {
      max-width: 1100px;
      margin: auto;
      padding: 25px 20px;
    }

    nav { 
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 0 30px;
    }

    .logo {
      font-size: 34px;
      font-weight: bold;
      color: #00d9ff;
      text-shadow: 0 0 20px #00d9ff;
    }

    .logout {
      border: 1px solid #00d9ff66;
      background: transparent;
      color: #bdefff;
      padding: 12px 22px;
      border-radius: 25px;
      cursor: pointer;
      font-size: 15px;
    }

    .welcome {
      padding: 35px;
      border-radius: 25px;
      border: 1px solid #00d9ff44;
      background: rgba(5, 20, 40, 0.75);
      backdrop-filter: blur(15px);
      box-shadow: 0 0 40px #0077ff22;
      margin-bottom: 25px;
    }

    .badge {
      display: inline-block;
      padding: 8px 16px;
      border-radius: 20px;
      border: 1px solid #00d9ff66;
      color: #00d9ff;
      font-size: 13px;
      margin-bottom: 20px;
    }

    h1 {
      font-size: clamp(30px, 7vw, 52px);
      margin-bottom: 12px;
    }

    h1 span {
      color: #00d9ff;
      text-shadow: 0 0 15px #00d9ff66;
    }

    .email {
      color: #8faac2;
      margin-bottom: 22px;
      word-break: break-word;
    }

    .description {
      color: #c1d1df;
      line-height: 1.7;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 20px;
    }

    .card {
      padding: 25px;
      border-radius: 20px;
      border: 1px solid #00d9ff33;
      background: rgba(5, 20, 40, 0.65);
      backdrop-filter: blur(10px);
    }

    .card h2 {
      color: #00d9ff;
      margin-bottom: 12px;
      font-size: 20px;
    }

    .card p {
      color: #9db2c7;
      line-height: 1.6;
    }

    .status {
      margin-top: 25px;
      padding: 15px;
      border-radius: 12px;
      background: #00d9ff0d;
      border: 1px solid #00d9ff33;
      color: #8feaff;
    }

    footer {
      text-align: center;
      color: #647a90;
      padding: 35px 0 20px;
      font-size: 13px;
    }
  </style>
</head>

<body>

<div class="container">

  <nav>
    <div class="logo">RI</div>


</body>
</html>
