<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Dashboard | Rofidin Ilyas</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.4"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      color: white;
      background:
        radial-gradient(circle at top right, #003b73, transparent 35%),
        radial-gradient(circle at bottom left, #001f3f, transparent 35%),
        #020817;
    }

    .container {
      width: 100%;
      max-width: 1100px;
      margin: auto;
      padding: 25px 20px;
    }

    nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 0 30px;
    }

    .logo {
      font-size: 30px;
      font-weight: bold;
      color: #00d9ff;
      text-shadow: 0 0 15px #00d9ff;
    }

    .logout {
      border: 1px solid #00d9ff66;
      background: transparent;
      color: #bdefff;
      padding: 10px 18px;
      border-radius: 20px;
      cursor: pointer;
    }

    .logout:hover {
      background: #00d9ff22;
    }

    .welcome {
      padding: 35px;
      border-radius: 25px;
      border: 1px solid #00d9ff44;
      background: rgba(5, 20, 40, 0.7);
      backdrop-filter: blur(15px);
      box-shadow: 0 0 40px #0077ff22;
      margin-bottom: 25px;
    }

    .badge {
      display: inline-block;
      padding: 7px 14px;
      border-radius: 20px;
      border: 1px solid #00d9ff55;
      color: #00d9ff;
      font-size: 13px;
      margin-bottom: 18px;
    }

    h1 {
      font-size: clamp(30px, 6vw, 50px);
      margin-bottom: 12px;
    }

    h1 span {
      color: #00d9ff;
    }

    .email {
      color: #8faac2;
      margin-bottom: 25px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 20px;
    }

    .card {
      padding: 25px;
      border-radius: 20px;
      border: 1px solid #00d9ff33;
      background: rgba(5, 20, 40, 0.6);
      backdrop-filter: blur(10px);
    }

    .card h2 {
      color: #00d9ff;
      margin-bottom: 10px;
      font-size: 20px;
    }

    .card p {
      color: #9db2c7;
      line-height: 1.6;
    }

    footer {
      text-align: center;
      color: #647a90;
      padding: 35px 0 20px;
      font-size: 13px;
    }
  </style>
</head>

<body>

  <div class="container">

    <nav>
      <div class="logo">RI</div>

      <button class="logout" id="logoutButton">
        Logout
      </button>
    </nav>

    <section class="welcome">

      <div class="badge">
        USER DASHBOARD
      </div>

      <h
